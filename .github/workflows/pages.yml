name: Publish frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional public HTTPS API address ending in /api/v1'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
      VITE_BASE_PATH: /calculus-tutor/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate backend address
        run: |
          node --input-type=module <<'JS'
          const api = new URL(process.env.VITE_API_BASE_URL);
          if (api.protocol !== 'https:' || api.username || api.password || api.search || api.hash || !/\/api\/v1\/?$/.test(api.pathname) || /^(localhost|127\.|0\.|\[?::1\]?)/i.test(api.hostname)) {
            throw new Error('Set repository variable API_BASE_URL to a public HTTPS address ending in /api/v1.');
          }
          JS
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
